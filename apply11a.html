<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form - Top Model of the World Australia 2027</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header-nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 20px;
            border-bottom: 1px solid #1a1a1a;
            letter-spacing: 2px;
            font-size: 13px;
        }
        .header-nav a {
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
        }
        .header-nav a.active {
            color: #d4af37;
            font-weight: bold;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
            background: #111111;
            border: 1px solid #222222;
            border-radius: 8px;
        }
        h1 {
            text-align: center;
            color: #d4af37;
            font-family: 'Georgia', serif;
            font-size: 32px;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        label {
            color: #d4af37;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input[type="text"], input[type="email"], input[type="date"], select, textarea {
            background-color: #1a1a1a;
            border: 1px solid #333333;
            color: #ffffff;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #d4af37;
            outline: none;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .criteria-box {
            grid-column: span 2;
            background-color: #090909;
            border: 1px solid #222222;
            padding: 20px;
            border-radius: 6px;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .criteria-box h3 {
            color: #d4af37;
            margin-top: 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-align: center;
        }
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 14px;
            color: #cccccc;
        }
        .checkbox-group:last-child {
            margin-bottom: 0;
        }
        .checkbox-group input[type="checkbox"] {
            margin-top: 3px;
            accent-color: #d4af37;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .submit-btn {
            grid-column: span 2;
            background-color: #d4af37;
            color: #000000;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #bda030;
        }
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
            .container {
                margin: 20px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="#">Home</a>
        <a href="#">About Us</a>
        <a href="#" class="active">Apply Now</a>
        <a href="#">Sponsors</a>
        <a href="#">Media</a>
        <a href="#">Contact Us</a>
    </div>

    <div class="container">
        <h1>Application Form</h1>
        
        <form action="https://api.web3forms.com/submit" method="POST">
            <!-- WEB3FORMS SYSTEM KEYS -->
            <input type="hidden" name="access_key" value="3ec49bf1-c2e5-4733-8661-5f5164d0a07b">
 <input type="hidden" name="subject" value="New National Finalist Application">
            <input type="hidden" name="redirect" value="thankyou.html">
            <input type="hidden" name="from_name" value="Top Model Australia Website">
<input type="checkbox" name="botcheck" class="hidden-field">            
            <div class="form-grid">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="Full Name" placeholder="As per ID" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="Email Address" placeholder="Active email" required>
                </div>
                
                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="Date of Birth" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" name="Phone Number" placeholder="Mobile number" required>
                </div>
                
                <div class="form-group">
                    <label for="instagram_link">Instagram Profile Link</label>
                    <input type="text" id="instagram_link" name="Instagram Link" placeholder="link to profile" required>
                </div>

                <div class="form-group">
                    <label for="instagram_handle">Your Instagram Handle</label>
                    <input type="text" id="instagram_handle" name="Instagram Handle" placeholder="e.g. @username" required>
                </div>
                
                <div class="form-group">
                    <label for="height">Height (CM)</label>
                    <input type="text" id="height" name="Height (CM)" placeholder="e.g. 175" required>
                </div>
                
                <div class="form-group">
                    <label for="state">State</label>
                    <select id="state" name="State" required>
                        <option value="" disabled selected>Select Your State</option>
                        <option value="NSW">New South Wales (NSW)</option>
                        <option value="VIC">Victoria (VIC)</option>
                        <option value="QLD">Queensland (QLD)</option>
                        <option value="WA">Western Australia (WA)</option>
                        <option value="SA">South Australia (SA)</option>
                        <option value="TAS">Tasmania (TAS)</option>
                        <option value="ACT">Australian Capital Territory (ACT)</option>
                        <option value="NT">Northern Territory (NT)</option>
                    </select>
                </div>
                
                <div class="form-group full-width">
                    <label for="marital_status">Marital Status</label>
                    <select id="marital_status" name="Marital Status" required>
                        <option value="" disabled selected>Select Marital Status</option>
                        <option value="Single">Single</option>
                        <option value="Married">Married</option>
                        <option value="Divorced">Divorced</option>
                    </select>
                </div>
                
                <div class="form-group full-width">
                    <label for="bio">Experience / Short Bio</label>
                    <textarea id="bio" name="Experience / Short Bio" placeholder="Briefly describe your modeling background..." required></textarea>
                </div>
                
                <!-- MANDATORY ELIGIBILITY CRITERIA CONTAINER -->
                <div class="criteria-box">
                    <h3>Mandatory Eligibility Criteria</h3>
                    
                    <div class="checkbox-group">
                        <input type="checkbox" id="crit_female" name="Criteria: Confirm Female" required>
                        <label for="crit_female" style="color: #cccccc; text-transform: none; font-weight: normal; margin-bottom: 0;">I confirm I am female</label>
                    </div>
                    
                    <div class="checkbox-group">
                        <input type="checkbox" id="crit_age" name="Criteria: Confirm Age 18-35" required>
                        <label for="crit_age" style="color: #cccccc; text-transform: none; font-weight: normal; margin-bottom: 0;">I confirm I am aged 18–35</label>
                    </div>
                    
                    <div class="checkbox-group">
                        <input type="checkbox" id="crit_passport" name="Criteria: Valid Passport" required>
                        <label for="crit_passport" style="color: #cccccc; text-transform: none; font-weight: normal; margin-bottom: 0;">I possess a valid passport</label>
                    </div>
                    
                    <div class="checkbox-group">
                        <input type="checkbox" id="crit_travel" name="Criteria: Fit to Travel" required>
                        <label for="crit_travel" style="color: #cccccc; text-transform: none; font-weight: normal; margin-bottom: 0;">I am fit to travel overseas</label>
                    </div>
                    
                    <div class="checkbox-group">
                        <input type="checkbox" id="crit_health" name="Criteria: Good Health" required>
                        <label for="crit_health" style="color: #cccccc; text-transform: none; font-weight: normal; margin-bottom: 0;">I am in good health</label>
                    </div>

                    <!-- NEW STRATEGY 1 INSTAGRAM CONTACT AGREEMENT -->
                    <div class="checkbox-group" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #222222;">
                        <input type="checkbox" id="crit_photographer" name="Criteria: Photographer Contact Agreement" required>
                        <label for="crit_photographer" style="color: #ffffff; text-transform: none; font-weight: bold; margin-bottom: 0;">I agree to be contacted via Instagram DM by the official tournament photographer to arrange my welcome photoshoot.</label>
                    </div>
                </div>
                
                <button type="submit" class="submit-btn">Submit Application</button>
            </div>
        </form>
    </div>

</body>
</html>
