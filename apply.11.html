<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Now – Top Model of the World Australia</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; }
        .form-container { max-width: 600px; margin: 40px auto; padding: 20px; border: 1px solid #333; }
        .field { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #d4af37; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="date"], select, textarea { 
            width: 100%; padding: 10px; background: #111; border: 1px solid #444; color: #fff; box-sizing: border-box;
        }
        .checkbox-group { background: #111; padding: 15px; border: 1px solid #222; margin-top: 20px; }
        .checkbox-item { margin-bottom: 10px; display: flex; align-items: flex-start; }
        .checkbox-item input { margin-right: 10px; margin-top: 3px; }
        .checkbox-item label { color: #fff; font-weight: normal; display: inline; }
        .submit-btn { 
            background-color: #d4af37; color: #000; border: none; padding: 15px; width: 100%; 
            font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px;
        }
        .submit-btn:hover { background-color: #b8942e; }
        .required-star { color: red; }
    </style>
</head>
<body>
    <div class="form-container">
        <h1 style="color: #d4af37; text-align: center;">Application Form</h1>
        <form action="thankyou.html" method="POST">
            <div class="field">
                <label for="fullname">Full Name <span class="required-star">*</span></label>
                <input type="text" id="fullname" name="fullname" placeholder="As per ID" required>
            </div>
            <div class="field">
                <label for="email">Email Address <span class="required-star">*</span></label>
                <input type="email" id="email" name="email" placeholder="Active email" required>
            </div>
            <div class="field">
                <label for="dob">Date of Birth <span class="required-star">*</span></label>
                <input type="date" id="dob" name="dob" required>
            </div>
            <div class="field">
                <label for="phone">Phone Number <span class="required-star">*</span></label>
                <input type="text" id="phone" name="phone" placeholder="Mobile number" required>
            </div>
            <div class="field">
                <label for="instagram_link">Instagram Link <span class="required-star">*</span></label>
                <input type="text" id="instagram_link" name="instagram_link" placeholder="link to profile" required>
            </div>
            <div class="field">
                <label for="instagram_handle">Instagram Handle <span class="required-star">*</span></label>
                <input type="text" id="instagram_handle" name="instagram_handle" placeholder="e.g. @username" required>
            </div>
            <div class="field">
                <label for="height">Height (cm) <span class="required-star">*</span></label>
                <input type="text" id="height" name="height" placeholder="e.g. 175" required>
            </div>
            <div class="field">
                <label for="state">State <span class="required-star">*</span></label>
                <select id="state" name="state" required>
                    <option value="">Select Your State</option>
                    <option value="NSW">NSW</option>
                    <option value="VIC">VIC</option>
                    <option value="QLD">QLD</option>
                    <option value="WA">WA</option>
                    <option value="SA">SA</option>
                    <option value="TAS">TAS</option>
                    <option value="ACT">ACT</option>
                    <option value="NT">NT</option>
                </select>
            </div>
            <div class="field">
                <label for="marital_status">Marital Status <span class="required-star">*</span></label>
                <select id="marital_status" name="marital_status" required>
                    <option value="">Select Marital Status</option>
                    <option value="Single">Single</option>
                    <option value="Married">Married</option>
                    <option value="Separated">Separated</option>
                    <option value="Divorced/Widow">Divorced/Widow</option>
                </select>
            </div>
            <div class="field">
                <label for="bio">Experience / Short Bio</label>
                <textarea id="bio" name="bio" rows="4" placeholder="Briefly describe your modeling background..."></textarea>
            </div>

            <div class="checkbox-group">
                <h3 style="color: #d4af37; margin-top: 0;">MANDATORY ELIGIBILITY CRITERIA</h3>
                <div class="checkbox-item">
                    <input type="checkbox" id="crit_female" name="crit_female" required>
                    <label for="crit_female">I confirm I am female</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="crit_age" name="crit_age" required>
                    <label for="crit_age">I confirm I am aged 18–35</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="crit_passport" name="crit_passport" required>
                    <label for="crit_passport">I possess a valid passport</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="crit_travel" name="crit_travel" required>
                    <label for="crit_travel">I am fit to travel overseas</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="crit_health" name="crit_health" required>
                    <label for="crit_health">I am in good health</label>
                </div>
                <!-- Strategy 1 Addition -->
                <div class="checkbox-item" style="border-top: 1px solid #333; padding-top: 10px; margin-top: 10px;">
                    <input type="checkbox" id="crit_photographer" name="crit_photographer" required>
                    <label for="crit_photographer" style="font-weight: bold; color: #d4af37;">I agree to be contacted via Instagram DM by the official tournament photographer to arrange my welcome photoshoot.</label>
                </div>
            </div>

            <button type="submit" class="submit-btn">SUBMIT APPLICATION</button>
        </form>
    </div>
</body>
</html>
