<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Now – Top Model of the World Australia</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=653">
    
    <style>
        body { background: #000; color: #fff; }
        .application-container { max-width: 800px; margin: 30px auto 60px; padding: 0 20px; }
        
        .form-card { 
            background: rgba(10, 10, 10, 0.9); 
            border: 1px solid #d4af37; 
            padding: 25px 22px; 
            border-radius: 4px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8); 
        }
        
        .gold-title { 
            text-align: center; 
            margin-bottom: 25px; 
            font-size: 1.7rem !important; 
            letter-spacing: 1px;
        }

        .custom-form-group { margin-bottom: 18px; }
        .custom-form-group label { 
            display: block; 
            color: #d4af37; 
            font-size: 0.7rem;
            text-transform: uppercase; 
            margin-bottom: 6px; 
            letter-spacing: 1.2px; 
            font-weight: 600; 
        }
        
        .custom-form-group input, .custom-form-group select, .custom-form-group textarea { 
            width: 100%; 
            padding: 10px;
            background: #1a1a1a; 
            border: 1px solid #333; 
            color: #fff; 
            font-size: 0.8rem;
            transition: 0.3s; 
        }
        .custom-form-group input::placeholder,
        .custom-form-group select:invalid { 
            color: #777; 
        }

        .custom-form-group input:focus { border-color: #d4af37; outline: none; }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1) sepia(100%) saturate(1000%) hue-rotate(10deg);
            cursor: pointer;
        }

        .eligibility-divider {
            width: 60%;
            height: 1px;
            background: #d4af37;
            margin: 25px auto 15px;
            opacity: 0.7;
        }

        .eligibility-confirm {
            margin: 15px auto 25px;
            text-align: center;
            max-width: 85%;
        }

        .eligibility-confirm h3 {
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .eligibility-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 20px;
            justify-items: center;
        }

        .eligibility-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .eligibility-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.85rem;
            color: #d4af37;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .eligibility-item:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        .eligibility-item input {
            display: none;
        }

        .eligibility-item .checkmark {
            width: 20px;
            height: 20px;
            background: #d4af37;
            border-radius: 50%;
            position: relative;
            transition: background 0.3s ease;
        }

        .eligibility-item .checkmark::after {
            content: "";
            position: absolute;
            top: 4px;
            left: 6px;
            width: 6px;
            height: 12px;
            border: solid #fff; 
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .eligibility-item input:checked + .checkmark::after {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .eligibility-confirm { max-width: 100%; }
            .eligibility-grid { grid-template-columns: 1fr; }
        }

        .submit-btn { 
            width: 100%; 
            padding: 15px; 
            background: #d4af37; 
            color: #000; 
            border: none; 
            font-weight: bold; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            cursor: pointer; 
            transition: 0.3s; 
            font-size: 0.85rem;
        }
        .submit-btn:hover { background: #fff; }

        .form-row { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            column-gap: 10px;   
            row-gap: 15px; 
        }

        .hidden-field { display: none !important; }
    </style>
</head>
<body>

<nav>
    <div class="menu-toggle" id="mobile-menu"><i class="fas fa-bars"></i></div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="apply.html" class="active">Apply Now</a>
        <a href="sponsors.html">Sponsors</a>
        <a href="media-australia.html">Media</a>
        <a href="contact.html">Contact Us</a>
    </div>
</nav>

<main class="application-container">
    <div class="form-card">
        <h1 class="gold-title">Application Form</h1>
        
        <form id="applicationForm">
            <input type="hidden" name="access_key" value="3ec49bf1-c2e5-4733-8661-5f5164d0a07b">
            <input type="hidden" name="subject" value="New National Finalist Application">
            <input type="hidden" name="from_name" value="Top Model Australia Website">
            <input type="checkbox" name="botcheck" class="hidden-field" style="display: none;">

            <div class="form-row">
                <div class="custom-form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" required placeholder="As per ID">
                </div>
                <div class="custom-form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required placeholder="Active email">
                </div>
            </div>

            <div class="form-row">
                <div class="custom-form-group">
                    <label>Date of Birth</label>
                    <input type="date" name="dob" required>
                </div>
                <div class="custom-form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" required placeholder="Mobile number">
                </div>
            </div>

            <div class="form-row">
                <div class="custom-form-group">
                    <label>Instagram Link</label>
                    <input type="url" name="instagram" required placeholder="link to profile">
                </div>
                <div class="custom-form-group">
                    <label>Height (cm)</label>
                    <input type="number" name="height" required placeholder="e.g. 175">
                </div>
            </div>

            <div class="form-row">
                <div class="custom-form-group">
                    <label>State</label>
                    <select name="state" required>
                        <option value="" disabled selected>Select Your State</option>
                        <option value="NSW">NSW</option><option value="VIC">VIC</option>
                        <option value="QLD">QLD</option><option value="WA">WA</option>
                        <option value="SA">SA</option><option value="TAS">TAS</option>
                        <option value="ACT">ACT</option><option value="NT">NT</option>
                    </select>
                </div>

                <div class="custom-form-group">
                    <label>Marital Status</label>
                    <select name="marital_status" required>
                        <option value="" disabled selected>Select Marital Status</option>
                        <option value="Single">Single</option>
                        <option value="Married">Married</option>
                        <option value="Separated">Separated</option>
                        <option value="Divorced/Widow">Divorced/Widow</option>
                    </select>
                </div>
            </div>

            <div class="custom-form-group">
                <label>Experience / Short Bio</label>
                <textarea name="bio" rows="3" placeholder="Briefly describe your modeling background..." required></textarea>
            </div>

            <div class="eligibility-divider"></div>

            <div class="eligibility-confirm">
                <h3>Eligibility Confirmation (Required)</h3>

                <div class="eligibility-grid">
                    <div class="eligibility-column">
                        <label class="eligibility-item">
                            <input type="checkbox" id="c_female" required>
                            <span class="checkmark"></span>
                            I confirm I am female
                        </label>

                        <label class="eligibility-item">
                            <input type="checkbox" id="c_passport" required>
                            <span class="checkmark"></span>
                            I possess a valid passport
                        </label>

                        <label class="eligibility-item">
                            <input type="checkbox" id="c_health" required>
                            <span class="checkmark"></span>
                            I am in good health
                        </label>
                    </div>

                    <div class="eligibility-column">
                        <label class="eligibility-item">
                            <input type="checkbox" id="c_age" required>
                            <span class="checkmark"></span>
                            I confirm I am aged 18–35
                        </label>

                        <label class="eligibility-item">
                            <input type="checkbox" id="c_travel" required>
                            <span class="checkmark"></span>
                            I am fit to travel overseas
                        </label>
                    </div>
                </div>
            </div>

            <!-- Single bundled hidden field for eligibility to satisfy Web3Forms security filter -->
            <input type="hidden" name="eligibility_status" id="eligibility_status" value="Confirmed">

            <button type="submit" class="submit-btn" id="submitBtn">Submit Application</button>
            <p id="formStatus" style="color: #d4af37; font-size: 0.7rem; text-align: center; margin-top: 10px; display: none; text-transform: uppercase;">Sending...</p>
        </form>
    </div>
</main>

<footer>
    <div class="social-icons" style="margin-bottom: 15px; text-align: center;">
        <a href="https://www.instagram.com/topmodeloftheworld_aus/" target="_blank" style="color: #d4af37; font-size: 1.5rem; margin: 0 10px;"><i class="fab fa-instagram"></i></a>
        <a href="https://www.facebook.com/profile.php?id=61579750535578" target="_blank" style="color: #d4af37; font-size: 1.5rem; margin: 0 10px;"><i class="fab fa-facebook"></i></a>
    </div>
    <div class="footer-links" style="text-align: center; margin-bottom: 15px;">
        <a href="sitemap.html" style="color: #d4af37; margin: 0 10px;">Sitemap</a>
        <a href="privacy.html" style="color: #d4af37; margin: 0 10px;">Privacy</a>
    </div>
    <div class="copyright" style="text-align: center;">
        <p style="color: #ccc; font-size: 0.75rem;">&copy; 2026 Top Model of the World - Australia. All rights reserved.</p>
        <p class="architect-credit" style="font-size: 0.6rem; margin-top: 10px; opacity: 0.7; color: #ccc;">Digital Architecture & Design support by Gemini.</p>
    </div>
</footer>

<script src="js/script.js"></script>
<script>
    const form = document.getElementById('applicationForm');
    const statusText = document.getElementById('formStatus');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Ensure browser validation checks individual custom checkboxes
        if (!document.getElementById('c_female').checked ||
            !document.getElementById('c_passport').checked ||
            !document.getElementById('c_health').checked ||
            !document.getElementById('c_age').checked ||
            !document.getElementById('c_travel').checked) {
            alert("Please check all eligibility requirements to proceed.");
            return;
        }

        statusText.style.display = 'block';
        btn.disabled = true;
        btn.innerText = "Processing...";
        
        const formData = new FormData(form);
        const object = Object.fromEntries(formData);
        
        // Pass standard consolidated status to prevent security parameter rejection
        object.eligibility_status = "All 5 Eligibility Criteria Checked and Confirmed by Applicant";

        const json = JSON.stringify(object);

        fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: json
        })
        .then(async (response) => {
            let jsonRes = await response.json();
            if (response.ok) {
                window.location.href = "thankyou-application.html";
            } else {
                alert("Submission failed: " + (jsonRes.message || "Check entries."));
                statusText.style.display = 'none';
                btn.disabled = false;
                btn.innerText = "Submit Application";
            }
        })
        .catch(error => {
            alert("Error connecting. Check your internet.");
            statusText.style.display = 'none';
            btn.disabled = false;
            btn.innerText = "Submit Application";
        });
    });
</script>
</body>
</html>
